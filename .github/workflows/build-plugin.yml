name: Build AkhilFlix Plugin + APK

# Every push to main/master rebuilds the plugin DEX and the host APK and
# publishes them to the `builds` branch — exactly like a CloudStream repo.
# The host app downloads the new DEX on next launch: a full app update,
# no APK update. The APK itself is rebuilt here too, so a fresh host APK
# is always available to download.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"

concurrency:
  group: build-akhilflix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK pre-installed; make sure the
      # exact platform + build-tools this project needs are present.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1); fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # No Gradle wrapper in the repo, so install Gradle directly.
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build plugin DEX
        run: gradle :plugin:buildPluginDex

      - name: Build host APK
        run: gradle :app:assembleRelease

      - name: Publish plugin + APK + repo.json to builds branch
        run: |
          DEX=plugin/build/plugin/akhilflix-plugin.dex
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$DEX" || { echo "DEX not found at $DEX"; exit 1; }
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          VERSION=${{ github.run_number }}
          mkdir -p publish
          cp "$DEX" publish/akhilflix-plugin.dex
          cp "$APK" publish/AkhilFlix.apk
          cat > publish/repo.json <<EOF
          {
            "name": "AkhilFlix",
            "version": $VERSION,
            "pluginClass": "com.akhilflix.app.AkhilFlixPluginImpl",
            "pluginUrl": "https://raw.githubusercontent.com/${{ github.repository }}/builds/akhilflix-plugin.dex",
            "appName": "AkhilFlix"
          }
          EOF
          cat publish/repo.json
          ls -la publish/
          cd publish
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "AkhilFlix build $VERSION"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:builds
