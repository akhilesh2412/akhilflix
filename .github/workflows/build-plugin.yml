name: Build AkhilFlix Plugin + APK

# Every push to main/master rebuilds the plugin DEX and the host APK and
# publishes them to the `builds` branch — exactly like a CloudStream repo.
# The host app downloads the new DEX on next launch: a full app update,
# no APK update. The APK itself is rebuilt here too, so a fresh host APK
# is always available to download.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"

concurrency:
  group: build-akhilflix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin DEX
        run: ./gradlew :plugin:buildPluginDex

      - name: Build host APK
        run: ./gradlew :app:assembleRelease

      - name: Publish plugin + APK + repo.json to builds branch
        run: |
          DEX=plugin/build/plugin/akhilflix-plugin.dex
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$DEX" || { echo "DEX not found at $DEX"; exit 1; }
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          VERSION=${{ github.run_number }}
          mkdir -p publish
          cp "$DEX" publish/akhilflix-plugin.dex
          cp "$APK" publish/AkhilFlix.apk
          cat > publish/repo.json <<EOF
          {
            "name": "AkhilFlix",
            "version": $VERSION,
            "pluginClass": "com.akhilflix.app.AkhilFlixPluginImpl",
            "pluginUrl": "https://raw.githubusercontent.com/${{ github.repository }}/builds/akhilflix-plugin.dex",
            "appName": "AkhilFlix"
          }
          EOF
          cat publish/repo.json
          ls -la publish/
          cd publish
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "AkhilFlix build $VERSION"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:builds
